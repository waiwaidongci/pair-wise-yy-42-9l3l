<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山火事件指挥与离线人员调度</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.5rem}</style></head><body><h1>山火事件指挥与离线人员调度</h1><p>维护火线、风向、资源和任务区，合并离线现场记录并防止人员重复分配</p><p>火线长度、风向变化和离线记录数量影响风险等级；同一资源不能同时出现在多个活动任务中。</p><p><button onclick="loadItems()">刷新事件列表</button><button onclick="loadFirelines()">火线归并概览</button><button onclick="loadConflicts()">待核冲突</button></p><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>
const h={'X-Actor':'demo','X-Role':'viewer'};
async function get(url){const r=await fetch(url,{headers:h});return JSON.stringify(await r.json(),null,2)}
async function loadItems(){document.getElementById('out').textContent=await get('/api/items')}
async function loadFirelines(){document.getElementById('out').textContent=await get('/api/firelines')}
async function loadConflicts(){document.getElementById('out').textContent=await get('/api/segment-conflicts?status=pending')}
</script></body></html>
